version: "3.9"

services:
  bot:
    build: .
    container_name: tgbot
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bot.py:/app/bot.py

  webapp:
    image: nginx:alpine
    container_name: tgbot-webapp
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
